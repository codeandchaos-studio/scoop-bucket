name: Auto Update Manifests

on:
  schedule:
    # Check for new releases every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Releases and Update Manifests
        shell: powershell
        run: |
          $projects = @(
            @{
              Repo = "codeandchaos-studio/D-Deck"
              ManifestPath = "bucket/ddeck.json"
              BinName = "D-Deck.exe"
            },
            @{
              Repo = "codeandchaos-studio/Format-Relay"
              ManifestPath = "bucket/formatrelay.json"
              BinName = "FormatRelay.exe"
            }
          )

          $anyUpdated = $false
          $headers = @{ "Accept" = "application/vnd.github.v3+json" }

          foreach ($proj in $projects) {
            $repo = $proj.Repo
            $manifestPath = $proj.ManifestPath
            $binName = $proj.BinName

            Write-Host "Checking latest release for $repo..."
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $headers
            } catch {
              Write-Warning "Failed to fetch releases for $repo: $_"
              continue
            }

            if (-not $release -or -not $release.tag_name) {
              Write-Host "No release found for $repo."
              continue
            }

            $version = $release.tag_name.TrimStart('v')

            if (-not (Test-Path $manifestPath)) {
              Write-Warning "Manifest not found: $manifestPath"
              continue
            }

            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            Write-Host "Latest GitHub release ($repo): $version"
            Write-Host "Current manifest version: $($manifest.version)"

            if ($manifest.version -ne $version) {
              Write-Host "New version detected ($version). Updating $manifestPath..."
              $asset = $release.assets | Where-Object { $_.name -like "*Portable*.exe" } | Select-Object -First 1

              if (-not $asset) {
                Write-Warning "Portable executable asset not found in release for $repo."
                continue
              }

              $tempFile = "temp-$($asset.name)"
              Write-Host "Downloading $($asset.name) to compute SHA256..."
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tempFile

              $hash = (Get-FileHash -Path $tempFile -Algorithm SHA256).Hash.ToLower()
              Remove-Item $tempFile -Force
              Write-Host "Computed SHA256: $hash"

              $manifest.version = $version
              $manifest.url = "https://github.com/$repo/releases/download/v$version/$($asset.name)#/$binName"
              $manifest.hash = $hash

              $manifest | ConvertTo-Json -Depth 4 | Set-Content $manifestPath -Encoding utf8
              Write-Host "Manifest $manifestPath updated successfully."
              $anyUpdated = $true
            } else {
              Write-Host "Manifest $manifestPath is already up to date with version $version."
            }
          }

          if ($anyUpdated) {
            echo "UPDATED=true" >> $env:GITHUB_ENV
          } else {
            echo "UPDATED=false" >> $env:GITHUB_ENV
          }

      - name: Commit and Push Changes
        if: env.UPDATED == 'true'
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/*.json
          git commit -m "Auto-update scoop manifests to latest releases"
          git push origin main
